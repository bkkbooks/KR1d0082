body:
  text: 郊社禘祫問禮類四三禮總義之屬提要臣等謹案郊社禘祫問一卷國朝毛奇齡撰前為答其門人李塨問南北分祀及問有禘無祫之說末附艾堂問自注云同郡學人集于艾堂有問此則專論禘祫者奇齡性喜攻駁前人南北郊分祀以冬夏至日禮有明文疑無北郊之祀者本無庸置辨至於時祭之外禘為大祭所謂三年一祫五年一禘者語出緯書本不足據祫對犆為義不對禘為義也書內辨大禘與吉禘不相䝉又言大禘吉禘時祭必合祭故稱祫皆發昔儒所未及於經義不為無補亦足資禮家之采擇焉乾隆四十三年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:8172a8d31cc1f18154956170f1c6809864219a121f1787686308d713b3fffa40
